<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Assignment Operators</title>
</head>

<body>

    <script>
        // ==========================================
        // JavaScript Assignment Operators
        // ==========================================

        // Definition:
        // Assignment operators ka use variable mein
        // value assign karne ya existing value ko update
        // karne ke liye hota hai.


        // 1. = Assignment Operator
        // Definition:
        // Variable mein value assign karta hai.

        let a = 10;

        console.log( a);


        // 2. += Add and Assignment Operator
        // Definition:
        // Variable ki current value mein given value ko add
        // karke result ko same variable mein store karta hai.

        let b = 10;

        b += 5;

        console.log( b);


        // 3. -= Subtract and Assignment Operator
        // Definition:
        // Variable ki current value mein se given value ko
        // subtract karke result ko same variable mein store karta hai.

        let c = 10;

        c -= 5;

        console.log( c);


        // 4. *= Multiply and Assignment Operator
        // Definition:
        // Variable ki current value ko given value se multiply
        // karke result ko same variable mein store karta hai.

        let d = 10;

        d *= 5;

        console.log( d);


        // 5. /= Divide and Assignment Operator
        // Definition:
        // Variable ki current value ko given value se divide
        // karke result ko same variable mein store karta hai.

        let e = 10;

        e /= 5;

        console.log( e);


        // 6. %= Modulus and Assignment Operator
        // Definition:
        // Variable ki current value ko given value se divide
        // karke jo remainder (shesh) milta hai,
        // us remainder ko same variable mein store karta hai.

        let f = 10;

        f %= 3;

        console.log( f);


        // 7. **= Exponentiation and Assignment Operator
        // Definition:
        // Variable ki current value ki given power calculate
        // karke result ko same variable mein store karta hai.

        let g = 10;

        g **= 2;

        console.log( g);


//         Assignment (=): 10
// Add and Assignment (+=): 15
// Subtract and Assignment (-=): 5
// Multiply and Assignment (*=): 50
// Divide and Assignment (/=): 2
// Modulus and Assignment (%=): 1
// Exponentiation and Assignment (**=): 100
    </script>

</body>

</html>
