<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1. String    //String → text/characters store karne ke liye.
let name = "Sudheer";

// 2. Number//numbers store karne ke liye, jaise integer aur decimal.
let age = 22;

// 3. Boolean //sirf do values hoti hain:
let isStudent = true;

// 4. Undefined //variable declare kiya hai, lekin usko koi value nahi di.
let mobile;

// 5. Null //intentionally batana ki abhi koi value nahi hai.
let user = null;

// 6. BigInt   //bahut bade integer numbers ko store karne ke liye.

//⚠️ Number ke end mein n lagta hai.
let bigNumber = 12345678901234567890n;

// 7. Symbol  //ek unique value banane ke liye use hota hai.
let id = Symbol("userId");

console.log(name);
console.log(age);
console.log(isStudent);
console.log(mobile);
console.log(user);
console.log(bigNumber);
console.log(id);
    </script>
</body>
</html>
