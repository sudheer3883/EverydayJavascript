<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // JavaScript Comparison Operators
      // Equal to  (==)   operator do values ko compare karta hai aur datatype ko ignore karke value check karta hai
      let a = 10;
      let b = "10";
      console.log(a == b);
      // Output: true

//. === — Strict Equal To:_operator value aur datatype dono ko compare karta hai.
let c = 7;
let d = "7";
console.log(c === d);
// Output: false


//!= — Not Equal To:-check karta hai ki do values equal nahi hain.
let e = 10;
let f = 20;
console.log(e != f);
// Output: true


// !== — Strict Not Equal To:-
let g = 10;
let h = "10";
console.log(g !== h);
// Output: true



//>  Greater Than:-> check karta hai ki left-side value right-side value se badi hai ya nahi.
let i = 20;
let j = 10;
console.log(i > j);

// Output: true


//Less than <:-<= check karta hai ki left value right value se chhoti ya equal hai.
let k = 10;
let l = 20;
console.log(k <= l);
// Output: true



    </script>
  </body>
</html>
