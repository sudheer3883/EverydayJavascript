<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //JavaScript Non-Primitive Data Types

      //JavaScript me Non-Primitive (Reference) Data Types wo data types hote hain jo multiple values ko store kar sakte hain aur generally reference ke through access hote hain.

      //object //Object me data key-value pair me store hota hai.
      let student = {
        name: "Sudheer",
        age: 22,
        course: "MERN",
      };
      console.log(student.name);
      //array
      //Array me multiple values ek hi variable me store kar sakte hain.

      let fruits = ["Apple", "Mango", "Banana"];

      console.log(fruits);
    </script>
  </body>
</html>
